<!DOCTYPE html>
<html lang="en">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    overflow: hidden; /* prevents any scrollbars */
  }

  .calendar-container {
    position: absolute;
    top: 0;
    right: 0;
    width: 35vw;  /* adjust percentage to control size */
    height: 25vw; /* same value as width to keep it square */
  }

  .calendar-container iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
</style>

<div class="calendar-container">
    <iframe src="https://calendar.google.com/calendar/embed?src=nick.sigurdson%40gmail.com&ctz=America%2FDenver
    &showTabs=0
    &showPrint=0
    &showTitle=0
    &showNav=0"
    style="border: 0" width="800" height="600" frameborder="0">
    </iframe>
</div>
</html>
