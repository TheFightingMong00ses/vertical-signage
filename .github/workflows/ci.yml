name: Vertical-Signage CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============================================================
  # JOB 1: Code Quality Checks
  # ============================================================
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: false

      - name: Check code formatting (Prettier)
        run: npm run format:check
        continue-on-error: false


  # ============================================================
  # JOB 2: Run Tests
  # ============================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: code-quality # Only run tests if code quality passes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
        
      - name: Install dependencies
        run: npm ci

      - name: Run jest tests
        run: npm test
        continue-on-error: false

    # Uncomment when you add test coverage
    # - name: Run tests with coverage
    #   run: npm run test:coverage

    # - name: Upload coverage to Codecov
    #   uses: codecov/codecov-action@v4
    #   with:
    #     files: ./coverage/lcov.info
    #     fail_ci_if_error: false



  # ============================================================
  # JOB 3: Security Audit
  # ============================================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true # Don't fail CI on audit issues

      - name: Check for outdated dependencies
        run: npm outdated
        continue-on-error: true

  # ============================================================
  # JOB 4: Deploy (Only on main branch)
  # ============================================================
  

